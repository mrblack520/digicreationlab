<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 320" fill="none">
  <defs>
    <linearGradient id="hornGrad" x1="40" y1="40" x2="240" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B7CFF"/>
      <stop offset="0.55" stop-color="#6B5CE7"/>
      <stop offset="1" stop-color="#5548C8"/>
    </linearGradient>
    <linearGradient id="coneGrad" x1="60" y1="80" x2="200" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A99BFF"/>
      <stop offset="1" stop-color="#6E5FE8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#4A3DB0" flood-opacity="0.28"/>
    </filter>
  </defs>
  <!-- handle -->
  <rect x="42" y="148" width="58" height="28" rx="10" fill="url(#hornGrad)" filter="url(#soft)" transform="rotate(-18 42 148)"/>
  <ellipse cx="48" cy="162" rx="14" ry="16" fill="#7A6BF0" transform="rotate(-18 48 162)"/>
  <!-- cone body -->
  <path d="M88 130 C 120 95, 175 70, 235 55 C 248 90, 250 145, 238 195 C 175 185, 120 165, 88 155 Z" fill="url(#coneGrad)" filter="url(#soft)"/>
  <!-- cone rim -->
  <ellipse cx="238" cy="125" rx="22" ry="72" fill="#9B8CFF" transform="rotate(-8 238 125)"/>
  <ellipse cx="235" cy="125" rx="14" ry="58" fill="#C4BAFF" opacity="0.55" transform="rotate(-8 235 125)"/>
  <!-- highlight -->
  <path d="M110 128 C 145 105, 185 90, 220 82" stroke="#E8E2FF" stroke-width="8" stroke-linecap="round" opacity="0.45"/>
  <!-- small detail ring -->
  <ellipse cx="100" cy="142" rx="10" ry="14" fill="#5C4FD4" transform="rotate(-18 100 142)"/>
</svg>
